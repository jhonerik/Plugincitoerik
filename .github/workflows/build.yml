name: Build ClipSampler Installers (Windows .exe & macOS .pkg)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. Compilación y Generación del Instalador de Windows (.exe)
  # ============================================================================
  build-windows:
    name: Windows (VST3 & Inno Setup .exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Asegurar Inno Setup (ISCC)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Configurar CMake (Visual Studio 2022)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar Plugin en Release
        run: |
          cmake --build build --config Release --parallel

      - name: Compilar Instalador Ejecutable (.exe) con Inno Setup
        run: |
          iscc installer/windows_installer.iss

      - name: Subir Instalador Windows (.exe) como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ClipSampler_Windows_Installer_EXE
          path: dist_windows/*.exe
          if-no-files-found: error

  # ============================================================================
  # 2. Compilación y Generación del Instalador de macOS (.pkg)
  # ============================================================================
  build-macos:
    name: macOS Universal Binary (VST3 & .pkg)
    runs-on: macos-14

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar CMake Universal (arm64 + x86_64)
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.13"

      - name: Compilar Plugin en Release
        run: |
          cmake --build build --config Release

      - name: Generar Paquete Instalador (.pkg)
        run: |
          chmod +x installer/build_pkg.sh
          ./installer/build_pkg.sh

      - name: Subir Instalador macOS (.pkg) como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ClipSampler_macOS_Installer_PKG
          path: dist_macos/*.pkg
          if-no-files-found: error
